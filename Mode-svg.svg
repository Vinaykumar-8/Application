<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="200" height="200" fill="none">
  <!-- Outer Glow / Subtle Ring -->
  <circle cx="12" cy="12" r="10" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Sun Rays (Brightness Mode Side - Left) -->
  <g stroke="#636366" stroke-width="1.75" stroke-linecap="round">
    <line x1="12" y1="3" x2="12" y2="1" />
    <line x1="5.64" y1="5.64" x2="4.22" y2="4.22" />
    <line x1="3" y1="12" x2="1" y2="12" />
    <line x1="5.64" y1="18.36" x2="4.22" y2="19.78" />
    <line x1="12" y1="21" x2="12" y2="23" />
  </g>

  <!-- Split Center Body (Sun/Moon Combo) -->
  <g>
    <!-- Left Half: Sun Core (Light Grey) -->
    <path d="M 12 6 A 6 6 0 0 0 12 18 Z" fill="#AEAEB2" />
    
    <!-- Right Half: Moon Crescent (Darker Grey) -->
    <path d="M 12 6 A 6 6 0 0 1 12 18 A 4.5 4.5 0 0 0 12 6 Z" fill="#3A3A3C" />
  </g>

  <!-- Divider Line for Sharp Contrast -->
  <line x1="12" y1="6" x2="12" y2="18" stroke="#1C1C1E" stroke-width="0.75"/>
</svg>
